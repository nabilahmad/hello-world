name: dxf-viewer CI

on:
  push:
    paths: ['dxf-viewer/**', '.github/workflows/dxf-viewer-ci.yml']
  pull_request:
    paths: ['dxf-viewer/**', '.github/workflows/dxf-viewer-ci.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: dxf-viewer

jobs:
  web:
    name: Unit + browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dxf-viewer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  desktop:
    name: Desktop build + window smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dxf-viewer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'dxf-viewer/src-tauri -> target'
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev \
            xvfb openbox xdotool imagemagick x11-utils dbus-x11
      - run: npm ci
      - run: npm run build
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build (debug, UI embedded)
        run: npx tauri build --debug --no-bundle
      - name: Drag tabs between real windows (Xvfb)
        env:
          OUT: ${{ runner.temp }}/desktop-smoke
        run: scripts/desktop-smoke.sh src-tauri/target/debug/dxf-viewer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-screenshots
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
